<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Watch Robotics 2720 — Social Media Strategy</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e8001c;
    --red-dim: #a80014;
    --black: #080a0c;
    --dark: #0d1117;
    --panel: #111620;
    --panel2: #161d2a;
    --border: rgba(232,0,28,0.25);
    --text: #e8ecf0;
    --muted: #6b7a8d;
    --gold: #f0b429;
    --cyan: #00d4ff;
    --green: #00e676;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    cursor: none;
  }

  /* Custom cursor */
  .cursor {
    position: fixed;
    width: 12px; height: 12px;
    background: var(--red);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s, width 0.2s, height 0.2s, background 0.2s;
    mix-blend-mode: screen;
  }
  .cursor-ring {
    position: fixed;
    width: 36px; height: 36px;
    border: 1.5px solid rgba(232,0,28,0.5);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: left 0.12s ease-out, top 0.12s ease-out, width 0.2s, height 0.2s;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }

  /* Scanlines */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
    pointer-events: none;
    z-index: 999;
  }

  /* ---- HERO ---- */
  #hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(232,0,28,0.12) 0%, transparent 70%);
  }

  .hero-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(232,0,28,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,0,28,0.06) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridScroll 20s linear infinite;
  }

  @keyframes gridScroll {
    0% { transform: translateY(0); }
    100% { transform: translateY(60px); }
  }

  .team-number {
    font-family: 'Orbitron', monospace;
    font-size: clamp(5rem, 20vw, 14rem);
    font-weight: 900;
    color: transparent;
    -webkit-text-stroke: 2px rgba(232,0,28,0.2);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    user-select: none;
    letter-spacing: -0.02em;
    animation: pulse-outline 4s ease-in-out infinite;
  }

  @keyframes pulse-outline {
    0%, 100% { -webkit-text-stroke-color: rgba(232,0,28,0.2); }
    50% { -webkit-text-stroke-color: rgba(232,0,28,0.5); }
  }

  .hero-content {
    position: relative;
    text-align: center;
    z-index: 2;
    animation: fadeUp 1s ease forwards;
    opacity: 0;
    animation-delay: 0.2s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .tag-line {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--red);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.5s;
  }

  .hero-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2rem, 6vw, 4.5rem);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 30%, var(--red) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 1rem;
  }

  .hero-sub {
    font-size: 1.05rem;
    color: var(--muted);
    font-weight: 300;
    max-width: 500px;
    margin: 0 auto 2.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.8s;
  }

  .authors {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1s;
  }

  .author-chip {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 0.3rem 0.9rem;
    border-radius: 2rem;
    letter-spacing: 0.1em;
    transition: border-color 0.3s, color 0.3s;
  }
  .author-chip:hover { border-color: var(--red); color: var(--text); }

  .scroll-hint {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1.4s;
  }

  .scroll-hint span {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .scroll-line {
    width: 1px;
    height: 50px;
    background: linear-gradient(to bottom, var(--red), transparent);
    animation: scrollPulse 2s ease-in-out infinite;
  }

  @keyframes scrollPulse {
    0%, 100% { opacity: 0.3; transform: scaleY(1); }
    50% { opacity: 1; transform: scaleY(1.2); }
  }

  /* ---- SECTIONS ---- */
  section {
    padding: 7rem 2rem;
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
  }

  .section-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--red);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    margin-bottom: 0.8rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .section-label::before {
    content: '';
    display: block;
    width: 30px;
    height: 1px;
    background: var(--red);
  }

  .section-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: 700;
    margin-bottom: 1rem;
    line-height: 1.15;
  }

  .section-desc {
    color: var(--muted);
    font-size: 1rem;
    max-width: 600px;
    line-height: 1.7;
    margin-bottom: 3.5rem;
  }

  /* ---- WHY SECTION ---- */
  .why-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5px;
    background: var(--border);
    border: 1.5px solid var(--border);
  }

  .why-card {
    background: var(--panel);
    padding: 2.5rem 2rem;
    position: relative;
    overflow: hidden;
    transition: background 0.3s;
  }

  .why-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 3px;
    background: var(--red);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s ease;
  }

  .why-card:hover { background: var(--panel2); }
  .why-card:hover::before { transform: scaleX(1); }

  .why-icon {
    font-size: 2.5rem;
    margin-bottom: 1.2rem;
    display: block;
  }

  .why-card h3 {
    font-family: 'Orbitron', monospace;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--red);
    margin-bottom: 0.8rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .why-card p {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.7;
  }

  /* ---- PLATFORMS SECTION ---- */
  .platforms-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
  }

  .platform-card {
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 2rem 1.5rem;
    position: relative;
    transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
    cursor: default;
  }

  .platform-card:hover {
    transform: translateY(-6px);
    border-color: var(--red);
    box-shadow: 0 20px 60px rgba(232,0,28,0.15);
  }

  .platform-icon {
    font-size: 2.8rem;
    margin-bottom: 1rem;
    display: block;
  }

  .platform-name {
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.3rem;
    letter-spacing: 0.05em;
  }

  .platform-handle {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--red);
    margin-bottom: 1.2rem;
  }

  .stat-row {
    display: flex;
    gap: 1.2rem;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
  }

  .stat-num-box {
    display: flex;
    align-items: baseline;
    white-space: nowrap;
  }

  .stat-value {
    font-family: 'Orbitron', monospace;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 0.4rem;
  }

  .new-badge {
    position: absolute;
    top: 1rem; right: 1rem;
    background: var(--red);
    color: white;
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    padding: 0.2rem 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ---- LINKEDIN SECTION ---- */
  .linkedin-section {
    border: 1px solid rgba(0,212,255,0.2);
    background: linear-gradient(135deg, rgba(0,212,255,0.03) 0%, transparent 60%);
    padding: 3.5rem;
    position: relative;
    overflow: hidden;
  }

  .linkedin-section::before {
    content: 'LINKEDIN';
    position: absolute;
    top: -0.5rem; right: 2rem;
    font-family: 'Orbitron', monospace;
    font-size: 5rem;
    font-weight: 900;
    color: transparent;
    -webkit-text-stroke: 1px rgba(0,212,255,0.06);
    pointer-events: none;
  }

  .linkedin-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1rem;
    margin-top: 2rem;
  }

  .li-reason {
    display: flex;
    gap: 1rem;
    align-items: flex-start;
    padding: 1.2rem;
    border: 1px solid rgba(0,212,255,0.1);
    background: rgba(0,212,255,0.03);
    transition: border-color 0.3s, background 0.3s;
  }

  .li-reason:hover {
    border-color: rgba(0,212,255,0.3);
    background: rgba(0,212,255,0.06);
  }

  .li-number {
    font-family: 'Orbitron', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    color: rgba(0,212,255,0.3);
    line-height: 1;
    flex-shrink: 0;
  }

  .li-text strong {
    display: block;
    font-size: 0.8rem;
    color: var(--cyan);
    margin-bottom: 0.3rem;
    font-weight: 600;
  }

  .li-text p {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.6;
  }

  /* ---- CONTENT STRATEGY ---- */
  .content-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1rem;
  }

  .content-card {
    padding: 2rem;
    position: relative;
    border: 1px solid var(--border);
    background: var(--panel);
    overflow: hidden;
    transition: transform 0.3s;
  }

  .content-card:hover { transform: translateY(-4px); }

  .content-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 3px;
    background: var(--card-color, var(--red));
  }

  .content-card-header {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 1.2rem;
  }

  .content-card-icon {
    font-size: 1.5rem;
  }

  .content-card-title {
    font-family: 'Orbitron', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--card-color, var(--red));
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .content-items {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .content-items li {
    font-size: 0.85rem;
    color: var(--muted);
    padding-left: 1rem;
    position: relative;
    line-height: 1.5;
  }

  .content-items li::before {
    content: '▸';
    position: absolute;
    left: 0;
    color: var(--card-color, var(--red));
    font-size: 0.7rem;
    top: 2px;
  }

  /* ---- SCHEDULE TABLE ---- */
  .schedule-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
  }

  th {
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 1rem 1.2rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  th:first-child { color: var(--red); }

  td {
    padding: 1rem 1.2rem;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    color: var(--muted);
    vertical-align: top;
    line-height: 1.5;
  }

  td:first-child {
    color: var(--text);
    font-weight: 700;
    white-space: nowrap;
  }

  tr:hover td {
    background: rgba(232,0,28,0.04);
    color: var(--text);
  }

  .freq-tag {
    display: inline-block;
    background: rgba(232,0,28,0.1);
    color: var(--red);
    padding: 0.15rem 0.5rem;
    font-size: 0.65rem;
    margin-bottom: 0.2rem;
    border: 1px solid var(--border);
  }

  /* ---- DIVIDER ---- */
  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    margin: 0;
    opacity: 0.3;
  }

  /* ---- FOOTER ---- */
  footer {
    text-align: center;
    padding: 4rem 2rem;
    border-top: 1px solid var(--border);
    position: relative;
  }

  .footer-logo {
    font-family: 'Orbitron', monospace;
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(135deg, #fff 30%, var(--red) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
  }

  footer p {
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
  }

  /* ---- SCROLL ANIMATIONS ---- */
  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }

  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .reveal-delay-1 { transition-delay: 0.1s; }
  .reveal-delay-2 { transition-delay: 0.2s; }
  .reveal-delay-3 { transition-delay: 0.3s; }
  .reveal-delay-4 { transition-delay: 0.4s; }

  /* ---- NAV ---- */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 500;
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(8,10,12,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    animation: fadeDown 0.8s ease forwards 0.3s;
    opacity: 0;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .nav-logo {
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.05em;
  }

  .nav-logo span { color: var(--red); }

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--red); }

  .counter { display: inline-block; }

  .red-line {
    width: 60px;
    height: 3px;
    background: var(--red);
    margin-bottom: 2rem;
  }

  @media (max-width: 600px) {
    .nav-links { display: none; }
    section { padding: 5rem 1.2rem; }
    .linkedin-section { padding: 2rem; }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<nav>
  <div class="nav-logo">RED<span>WATCH</span> 2720</div>
  <ul class="nav-links">
    <li><a href="#why">Why</a></li>
    <li><a href="#platforms">Platforms</a></li>
    <li><a href="#content">Content</a></li>
    <li><a href="#schedule">Schedule</a></li>
  </ul>
</nav>

<div id="hero">
  <div class="hero-grid"></div>
  <div class="team-number">2720</div>

  <div class="hero-content">
    <div class="tag-line">FRC Team 2720 · Strategy 2025</div>
    <h1 class="hero-title">Social Media<br>Strategy</h1>
    <p class="hero-sub">A roadmap to attract sponsors, build community, and recruit the next generation of engineers.</p>
    <div class="authors">
      <span class="author-chip">Vik</span>
      <span class="author-chip">Erick</span>
      <span class="author-
